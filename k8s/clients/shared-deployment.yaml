apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-worker
  namespace: shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-worker
  template:
    metadata:
      labels:
        app: shared-worker
    spec:
      imagePullSecrets:
        - name: intent-consumers
      containers:
        - name: shared-worker
          image: registry.digitalocean.com/intent-consumers/nih-worker:latest
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 300Mi  # about 4x the measured idle (72 MB), for busy signal days
          command: ["python", "signals/client_worker.py"]
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: LOOPS  # no CLIENT_SLUG: these loops work on tables shared by all clients
              value: "clia_enrichment,clia_sequence,job_posting_enrichment,linkedin_enrichment,linkedin_sequence"
            - name: POLL_INTERVAL_SECONDS
              value: "10"
